data:
  raw_path: data/raw/card_transaction.v1.csv
  nrows: 3000000             # first 3M rows = complete histories for about 252 users
  processed_path: data/processed/
  train_end_date: "2017-04-25 21:24:36"   # time-based split: set after EDA (transactions before this date go to train)
  target: is_fraud

features:
  velocity_windows: [1, 6, 24]   # hours

model:
  name: xgboost
  threshold: 0.5               # tuned later on Oct 11
  path: models/model.joblib

mlflow:
  experiment_name: fraud-detection
  tracking_uri: mlruns

api:
  host: 127.0.0.1
  port: 8000

streaming:
  kafka_bootstrap: localhost:9092
  topic: transactions
  redis_host: localhost
  redis_port: 6379
  send_interval_ms: 50

monitoring:
  prediction_db: predictions.db
  drift_report_dir: reports/
