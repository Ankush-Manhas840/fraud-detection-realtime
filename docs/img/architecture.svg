<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" width="980" height="230" role="img" aria-labelledby="t d"><title id="t">System architecture</title><desc id="d">Seven stages from data to dashboard with their status</desc><style>
