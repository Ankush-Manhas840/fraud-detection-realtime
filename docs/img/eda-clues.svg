</style><rect class="bg" width="760" height="328" rx="14"/><text class="h t1" x="24" y="36">Where fraud concentrates</text><text class="sub t2" x="24" y="58">Frauds per 10,000 purchases in each group (TabFormer, first 3 million rows)</text><text class="lab t1" x="198" y="92" text-anchor="end">Jewellery shops</text><path class="s1" d="M210,78 h456.0 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-456.0 z"/><text class="val t1" x="678.0" y="92">608</text><text class="lab t1" x="198" y="126" text-anchor="end">Electronics shops</text><path class="s1" d="M210,112 h421.19736842105266 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-421.19736842105266 z"/><text class="val t1" x="643.1973684210527" y="126">562</text><text class="lab t1" x="198" y="160" text-anchor="end">Purchases abroad</text><path class="s1" d="M210,146 h291.82236842105266 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-291.82236842105266 z"/><text class="val t1" x="513.8223684210527" y="160">391</text><text class="lab t1" x="198" y="194" text-anchor="end">First visit to a shop</text><path class="s1" d="M210,180 h113.26973684210526 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-113.26973684210526 z"/><text class="val t1" x="335.26973684210526" y="194">155</text><text class="lab t1" x="198" y="228" text-anchor="end">Online purchases</text><path class="s1" d="M210,214 h35.3421052631579 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-35.3421052631579 z"/><text class="val t1" x="257.3421052631579" y="228">52</text><text class="lab t1" x="198" y="262" text-anchor="end">All purchases</text><path class="muted" d="M210,248 h4.322368421052632 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-4.322368421052632 z"/><text class="val t1" x="226.32236842105263" y="262">11</text><text class="ax t2" x="24" y="310">Groups overlap, so rates are not additive. Grey bar = overall rate for reference.</text></svg>