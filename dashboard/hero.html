<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --sky-top: #3a1f55; --sky-bottom: #120c1f; --far: #2a1a3d; --building: #2d2638; --window: #1c3a6e; --window-lit: #f8d23c;
  --kaiju: #0d0a10; --kaiju-hatch: #3b3245; --flame: #f8d23c; --flame-deep: #f0a21f; }
html, body { margin: 0; background: transparent; font-family: "Space Grotesk", sans-serif; }
.scene { position: relative; overflow: hidden; height: 400px; margin: 4px 12px 12px 4px; border: 4px solid #0a080c; box-shadow: 9px 9px 0 #e8487f; background: #120c1f; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.halftone { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(0,0,0,.28) 1.4px, transparent 1.7px); background-size: 8px 8px; }
.title { position: absolute; left: 3%; top: 6%; z-index: 3; }
.kana { font-family: "Dela Gothic One"; color: #f6eedb; font-size: 18px; letter-spacing: .1em; -webkit-text-stroke: 1px #151116; text-shadow: 2px 2px 0 #151116; }
.name { font-family: "Dela Gothic One"; font-size: clamp(44px, 7vw, 92px); line-height: .9; color: #f8d23c; -webkit-text-stroke: 3px #151116; paint-order: stroke fill; text-shadow: 5px 5px 0 #151116; margin-top: 4px; }
.sub { margin-top: 10px; display: inline-block; background: #0a080c; color: #f6eedb; padding: 4px 10px; font-weight: 700; font-size: 13px; letter-spacing: .05em; }
.stat { position: absolute; left: 3%; bottom: 8%; z-index: 4; background: #f6eedb; color: #151116; border: 4px solid #151116; box-shadow: 6px 6px 0 #151116;
  padding: 10px 18px; transform: rotate(-2deg); max-width: 330px; }
.stat b { font-family: "Dela Gothic One"; font-weight: 400; font-size: 46px; color: #e2383c; -webkit-text-stroke: 1.5px #151116; line-height: 1; display: block; }
.stat span { font-weight: 700; font-size: 14px; }
.tag { position: absolute; z-index: 4; right: 2%; top: 5%; background: #e2383c; color: #f6eedb; border: 3px solid #151116; padding: 4px 12px;
  font-family: "Dela Gothic One"; font-size: 14px; transform: rotate(5deg); box-shadow: 4px 4px 0 #151116; }
.beam-line { stroke-dasharray: 2600; stroke-dashoffset: 2600; }
.go .beam-line { animation: zap 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
.go .beam-line.b2 { animation-delay: .2s; }
@keyframes zap { to { stroke-dashoffset: 0; } }
.flicker { animation: flick 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
@keyframes flick { from { transform: scaleY(1); } to { transform: scaleY(1.06); } }
.kaiju-g { transform-box: fill-box; transform-origin: 60% 100%; }
.go .kaiju-g { animation: rise-up 1s cubic-bezier(.2,.9,.3,1) .1s both; }
@keyframes rise-up { from { transform: translateY(40%); } to { transform: none; } }
.glow { animation: glow 1.8s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .45; } to { opacity: .95; } }
@media (prefers-reduced-motion: reduce) { .beam-line, .go .beam-line { animation: none; stroke-dashoffset: 0; } .flicker, .glow, .go .kaiju-g { animation: none; } }
</style></head><body>
<div class="scene" id="scene">
  <svg id="city" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="halftone"></div>
  <div class="title"><div class="kana">不正監視 ／ リアルタイム</div><div class="name">FRAUD<br>MONITOR</div>
    <div class="sub">Kafka → Redis → FastAPI → SQLite · live</div></div>
  <div class="tag">不正怪獣 · THE FRAUD KAIJU</div>
  <div class="stat"><b>177</b><span>frauds caught in the top 1,000 alerts, on 253 people the model never saw · random catches about 1</span></div>
</div>
<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("city");
const scene = document.getElementById("scene");
function el(tag, attrs, parent = svg, style) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (style) n.setAttribute("style", style);       // colours come from CSS variables, so the theme can change them
  parent.appendChild(n);
  return n;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---- sky ---- */
const defs = el("defs", {});
const g = el("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el("stop", { offset: "0" }, g, "stop-color: var(--sky-top)");
el("stop", { offset: "1" }, g, "stop-color: var(--sky-bottom)");
const hatch = el("pattern", { id: "hatch", width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(35)" }, defs);
el("line", { x1: 0, y1: 0, x2: 0, y2: 7, "stroke-width": 1.6 }, hatch, "stroke: var(--kaiju-hatch)");
el("rect", { width: 1200, height: 600, fill: "url(#sky)" });

/* ---- far skyline ---- */
for (let x = -20; x < 1220; ) {
  const w = 40 + rnd() * 60, h = 120 + rnd() * 200;
  el("rect", { x, y: 600 - h - 60, width: w, height: h + 60, stroke: "#151116", "stroke-width": 2 }, svg, "fill: var(--far)");
  x += w - 4;
}

/* ---- the fraud kaiju: an original giant reptile, rising behind the city ---- */
// scaled up around its feet; the inner group carries the rising animation
const kaijuBox = el("g", { transform: "translate(-180 -120) scale(1.2)" });
const kaiju = el("g", { class: "kaiju-g" }, kaijuBox);
// back spikes first, so the body covers their roots
const spikeRoots = [[812,176],[826,198],[842,224],[856,252],[869,282],[880,314],[889,348],[896,384],[901,420],[904,456]];
spikeRoots.forEach(([x, y], i) => {
  const s = 1 - i * 0.055, tx = x + 46 * s, ty = y - 30 * s;
  el("path", { d: `M${x - 12} ${y + 6} L${tx - 14} ${ty + 8} L${tx - 2} ${ty + 12} L${tx} ${ty} L${tx + 6} ${ty + 16} L${x + 14} ${y + 22} Z`,
    stroke: "#151116", "stroke-width": 4, "stroke-linejoin": "round" }, kaiju, "fill: var(--kaiju)");
});
const body = "M915 640 L908 470 C912 380 884 300 852 250 C836 222 820 194 802 168 L792 142 C776 116 740 104 700 112 L680 121 L736 140 L690 170 L758 180 C772 204 768 232 762 262 C752 330 762 420 784 640 Z";
el("path", { d: body, stroke: "#151116", "stroke-width": 5, "stroke-linejoin": "round" }, kaiju, "fill: var(--kaiju)");
el("path", { d: body, fill: "url(#hatch)", opacity: 0.5 }, kaiju);
// tail sweeping right
el("path", { d: "M900 520 C980 540 1060 556 1230 512 L1230 566 C1060 604 976 596 900 590 Z", stroke: "#151116", "stroke-width": 5, "stroke-linejoin": "round" }, kaiju, "fill: var(--kaiju)");
// arms with claws
[[768, 272, 0], [784, 316, 14]].forEach(([x, y, o]) => {
  el("path", { d: `M${x} ${y} C${x - 34} ${y + 12} ${x - 52} ${y + 28} ${x - 62} ${y + 46} l-10 6 l12 0 l-6 10 l12 -6 l2 10 l8 -14 C${x - 34} ${y + 38} ${x - 14} ${y + 30} ${x + 12} ${y + 30} Z`,
    stroke: "#151116", "stroke-width": 4, "stroke-linejoin": "round" }, kaiju, "fill: var(--kaiju)");
});
// teeth along both jaws
for (let i = 0; i < 5; i++) {
  const ux = 690 + i * 10, uy = 124 + i * 3.4;
  el("path", { d: `M${ux} ${uy} l5 10 l4 -9 z`, fill: "#f6eedb", stroke: "#151116", "stroke-width": 1.5 }, kaiju);
  const lx = 698 + i * 11, ly = 168 + i * 2;
  el("path", { d: `M${lx} ${ly} l5 -10 l4 9 z`, fill: "#f6eedb", stroke: "#151116", "stroke-width": 1.5 }, kaiju);
}
// mouth glow, eye
el("path", { d: "M690 128 L734 141 L696 165 Z", fill: "#56cdee", class: "glow" }, kaiju);
el("ellipse", { cx: 764, cy: 129, rx: 10, ry: 6, fill: "#f6eedb", stroke: "#151116", "stroke-width": 2.5 }, kaiju);
el("circle", { cx: 761, cy: 129, r: 3, fill: "#e2383c" }, kaiju);

/* ---- beams: the kaiju's breath, and searchlights ---- */
function beam(x1, y1, x2, y2, cls, w = 1) {
  el("line", { x1, y1, x2, y2, stroke: "#151116", "stroke-width": 15 * w, "stroke-linecap": "round", class: "beam-line " + cls });
  el("line", { x1, y1, x2, y2, stroke: "#56cdee", "stroke-width": 10 * w, "stroke-linecap": "round", class: "beam-line " + cls });
  el("line", { x1, y1, x2, y2, stroke: "#eafcff", "stroke-width": 3 * w, "stroke-linecap": "round", class: "beam-line " + cls });
}
beam(1240, 40, 160, 600, "b2", 0.7);
beam(660, 55, 300, -80, "", 1.8);          // the breath, scaled mouth position

/* ---- falling lattice tower ---- */
const tower = el("g", { transform: "translate(150 595) rotate(-22)" });
el("path", { d: "M-60 0 L-8 -360 L8 -360 L60 0", fill: "none", stroke: "#151116", "stroke-width": 9 }, tower);
el("path", { d: "M-60 0 L-8 -360 L8 -360 L60 0", fill: "none", stroke: "#e2383c", "stroke-width": 5 }, tower);
for (let i = 1; i < 9; i++) {
  const y = -i * 40, half = 60 - (52 * i) / 9;
  el("line", { x1: -half, y1: y, x2: half, y2: y, stroke: "#e2383c", "stroke-width": 3 }, tower);
  el("line", { x1: -half, y1: y, x2: half - 5, y2: y + 40, stroke: "#e2383c", "stroke-width": 2 }, tower);
  el("line", { x1: half, y1: y, x2: -half + 5, y2: y + 40, stroke: "#e2383c", "stroke-width": 2 }, tower);
}

/* ---- near city, in front of the kaiju ---- */
for (let x = 250; x < 1240; ) {
  const w = 70 + rnd() * 90, h = 100 + rnd() * 170, tilt = (rnd() - 0.5) * 7;
  const b = el("g", { transform: `rotate(${tilt} ${x + w / 2} 600)` });
  el("rect", { x, y: 600 - h, width: w, height: h + 10, stroke: "#151116", "stroke-width": 4 }, b, "fill: var(--building)");
  for (let wy = 600 - h + 14; wy < 580; wy += 22)
    for (let wx = x + 10; wx < x + w - 14; wx += 18)
      if (rnd() > 0.18) el("rect", { x: wx, y: wy, width: 10, height: 13, stroke: "#151116", "stroke-width": 1.2 }, b,
        rnd() > 0.82 ? "fill: var(--window-lit)" : "fill: var(--window)");
  x += w + 10 + rnd() * 40;
}

/* ---- flames ---- */
const flames = el("g", { class: "flicker" });
function fireRow(minH, maxH, minW, maxW) {
  let x = -40, d = "M-40 610";
  while (x < 1240) {
    const w = minW + rnd() * (maxW - minW), h = minH + rnd() * (maxH - minH);
    const curl = (rnd() - 0.5) * w * 1.4, tipX = x + w / 2 + curl, tipY = 600 - h;
    d += ` C${x + w * 0.1} ${600 - h * 0.45} ${tipX - curl * 1.4} ${tipY + h * 0.35} ${tipX} ${tipY}`;
    d += ` C${tipX - curl * 0.3} ${tipY + h * 0.4} ${x + w * 0.95} ${600 - h * 0.3} ${x + w} 600`;
    x += w * (0.7 + rnd() * 0.25);
  }
  return d + " L1240 610 Z";
}
el("path", { d: fireRow(70, 190, 50, 110), stroke: "#151116", "stroke-width": 5, "stroke-linejoin": "round" }, flames, "fill: var(--flame-deep)");
el("path", { d: fireRow(35, 105, 40, 80), stroke: "#151116", "stroke-width": 3.5, "stroke-linejoin": "round" }, flames, "fill: var(--flame)");
for (let i = 0; i < 26; i++) {
  const x = rnd() * 1200, y = 230 + rnd() * 300, s = 4 + rnd() * 8;
  el("path", { d: `M${x} ${y} l${s} ${s / 3} l${-s / 2} ${s} z`, fill: rnd() > 0.5 ? "#f6eedb" : "#e2383c", stroke: "#151116", "stroke-width": 1.5 });
}

scene.classList.add('go');
</script></body></html>
